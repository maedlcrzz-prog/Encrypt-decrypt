<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encrypt Text</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <div class="container">
    <h1>🔐 Encrypt Text</h1>
    <textarea id="inputText" placeholder="Enter your text here..."></textarea>
    <input id="key" type="number" placeholder="Enter key (e.g., 3)" />
    <button onclick="encrypt()">Encrypt</button>
    <h3>Result:</h3>
    <div id="output"></div>
    <div class="nav">
      <a href="welcomepage.html">🏠 Home</a> |
      <a href="decrypt.html">🔓 Go to Decryption</a>
    </div>
  </div>
<script>
    function caesarCipher(text, shift) {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let result = '';
      shift = shift % 26;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const isLower = char === char.toLowerCase();
        const baseChar = char.toUpperCase();

        if (alphabet.includes(baseChar)) {
          const newIndex = (alphabet.indexOf(baseChar) + shift + 26) % 26;
          const newChar = alphabet[newIndex];
          result += isLower ? newChar.toLowerCase() : newChar;
        } else {
          result += char;
        }
      }
      return result;
    }

    function encrypt() {
      const text = document.getElementById("inputText").value;
      const key = parseInt(document.getElementById("key").value) || 0;
      document.getElementById("output").textContent = caesarCipher(text, key);
    }
  </script>
 
</body>
</html>
