<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encrypt Text</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #4b6cb7, #182848);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 400px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 1rem;
      outline: none;
      resize: none;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 1rem;
    }

    button {
      margin: 10px 5px;
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background-color: #00c6ff;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #0072ff;
    }

    #output {
      background: rgba(255, 255, 255, 0.2);
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      min-height: 60px;
      font-size: 1rem;
      word-break: break-word;
    }

    .nav {
      margin-top: 20px;
    }

    .nav a {
      color: #00c6ff;
      text-decoration: none;
      margin: 0 10px;
    }

    .nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Encrypt Text</h1>
    <textarea id="inputText" placeholder="Enter your text here..."></textarea>
    <input id="key" type="number" placeholder="Enter key (e.g., 3)" />
    <button onclick="encrypt()">Encrypt</button>
    <h3>Result:</h3>
    <div id="output"></div>
    <div class="nav">
      <a href="welcomepage.html">🏠 Home</a> |
      <a href="decrypt.html">🔓 Go to Decryption</a>
    </div>
  </div>

  <script>
    function caesarCipher(text, shift) {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let result = '';
      shift = shift % 26;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const isLower = char === char.toLowerCase();
        const baseChar = char.toUpperCase();

        if (alphabet.includes(baseChar)) {
          const newIndex = (alphabet.indexOf(baseChar) + shift + 26) % 26;
          const newChar = alphabet[newIndex];
          result += isLower ? newChar.toLowerCase() : newChar;
        } else {
          result += char;
        }
      }
      return result;
    }

    function encrypt() {
      const text = document.getElementById("inputText").value;
      const key = parseInt(document.getElementById("key").value) || 0;
      document.getElementById("output").textContent = caesarCipher(text, key);
    }
  </script>
</body>
</html>
